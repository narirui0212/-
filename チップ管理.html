<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10251b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="松田ダービー"><title>松田ダービー</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:#f8f9f4;background:#10251b}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation;border:0;border-radius:10px;background:#d8b971;color:#15261b;font-weight:750;padding:12px 10px;min-height:43px}button:disabled{opacity:.4;cursor:not-allowed}button.secondary{background:#2d4c3b;color:#f5f5ee;border:1px solid #66816d}button.danger{background:#6c3836;color:white}.wrap{max-width:650px;margin:auto;padding:14px 13px 35px}.head{text-align:center;padding:12px 0 20px}.head h1{color:#f5d88d;font-size:27px;margin:0}.sub{color:#b6c8b9;font-size:11px;letter-spacing:2px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.pill{background:#2a4835;padding:7px 11px;border-radius:18px;font-size:12px}.panel{background:#1d392b;border-radius:15px;padding:15px;margin-bottom:13px}.panel h2{color:#f5d88d;font-size:19px;margin:0 0 14px}.panel h3{color:#f5d88d;font-size:15px;margin:5px 0 12px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.row+.row{margin-top:10px}.box{background:#132d21;padding:12px;border-radius:11px;margin:9px 0}.small{font-size:12px;color:#c0d2c4}.tiny{font-size:11px;color:#b4c6b9}.gold{color:#f3d48d}.green{color:#9de5b4}.red{color:#ffb9aa}.big{font-size:23px;font-weight:800}.muted{color:#c6d4c9}.buttons{display:flex;gap:6px}.buttons>*{flex:1;min-width:0}.quad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}.quad button{font-size:12px;padding:10px 2px}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.horse{background:#142d21;border:1px solid #45604b;border-radius:11px;padding:12px;text-align:left;min-height:86px;color:#fff;font-weight:400}.horse.on{border:2px solid #e6c37b;background:#385d43;padding:11px}.horse strong{color:#f2d58f}.horse .hn{display:block;font-size:12px;margin:7px 0}.full{width:100%;margin:9px 0 0}.hint{font-size:12px;line-height:1.65;color:#d0e0d3}.warn{padding:12px;background:#56352c;color:#ffdfbf;border-radius:11px;margin:12px 0;font-size:13px;line-height:1.6}.confirm{border:1px solid #e2c17a;border-radius:12px;padding:13px;margin-top:13px;background:#142e22}.betrow{display:flex;gap:7px;align-items:center;background:#142d21;padding:9px;border-radius:10px;margin:7px 0}.betrow .desc{flex:1;font-size:12px}.betrow button{width:40px;padding:8px 0;font-size:19px}.betrow .num{min-width:24px;text-align:center;font-weight:800}.tab{font-size:13px;padding:11px 2px;background:#2a4a36;color:#fff}.tab.on{background:#d8b971;color:#17271d}hr{border:0;border-top:1px solid #49614e;margin:13px 0}.line{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:6px 0;font-size:13px}.line b{text-align:right}.transfer{background:#142d21;padding:12px;border-radius:10px;margin:8px 0;border-left:3px solid #e6c37b}.transfer .amt{font-size:22px;font-weight:800;color:#f5d88d;margin-top:5px}.foot{text-align:center;font-size:11px;color:#b2c6b6;margin:20px 0}.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat .box{margin:0}.stat .big{font-size:18px}select{background:#142d21;border:1px solid #76917d;color:#fff;border-radius:9px;padding:12px;width:100%}.error{background:#61372c;border-radius:9px;padding:11px;margin-bottom:13px;color:#ffe1be}.actions{display:flex;gap:8px;margin-top:12px}.actions>*{flex:1}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:10px 4px;border-bottom:1px solid #45604b;text-align:right}th:first-child,td:first-child{text-align:left}.filebutton{display:block;text-align:center;border:1px solid #79977d;background:#294a37;border-radius:10px;padding:12px;margin-top:9px;cursor:pointer;font-weight:700}.filebutton input{display:none} .status{color:#f4d88d;text-align:center;font-size:12px;margin-bottom:8px} .footnote{font-size:11px;line-height:1.6;color:#c6d7c9}
</style></head><body><main class="wrap"><header class="head"><h1>♛ 松田ダービー ♛</h1><div class="sub">CHIP & RACE MANAGER</div></header><div id="app"></div><div class="foot">1チップ＝50円 · 自動保存対応 · 暫定版 v1.0</div></main><script>
(()=>{'use strict';const N=['松田','大川','多加谷','濱田','成塚'],H=[['メグミブライアン',2],['ハマダノックス',3],['ユウテイオー',4],['マナチャンデサイル',5],['サイレンスアヤネ',6],['マツダブルボン',6],['シンチャンブラック',7],['ルイエンペラー',7],['ノーブインパクト',9],['サメイターボ',13]],KEY='matsuda-derby-v1';const defaults=()=>({page:'initial',initial:[1000,1000,1000,1000,1000],wallet:[0,0,0,0,0],purchases:[0,0,0,0,0],round:1,parent:0,feeDone:false,sel:[0,1,4,5,6,7],bets:{},buyer:1,winner:null,records:[],addWho:0,addValue:500,back:'fee',cashed:[false,false,false,false,false],cashWho:null,confirm:'',error:''});let s=defaults();try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&Array.isArray(v.wallet)&&v.wallet.length===5&&Array.isArray(v.purchases)&&v.purchases.length===5)s={...s,...v,confirm:'',error:'',cashWho:null}}catch(e){}const $=document.getElementById('app');const y=n=>Math.abs(n).toLocaleString('ja-JP')+'円',sy=n=>(n>0?'+':n<0?'−':'')+y(n),esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const children=()=>N.map((name,i)=>({name,i})).filter(p=>p.i!==s.parent),count=i=>s.sel.reduce((a,h)=>a+(s.bets[i+'-'+h]||0),0),stake=i=>count(i)*50,pot=()=>children().reduce((a,p)=>a+stake(p.i),0),payout=i=>s.winner===null?0:(s.bets[i+'-'+s.winner]||0)*50*H[s.winner][1],paid=()=>children().reduce((a,p)=>a+payout(p.i),0),parentAfter=()=>s.wallet[s.parent]+pot()-paid(),sum=a=>a.reduce((x,v)=>x+v,0),feeChanges=()=>N.map((_,i)=>i===s.parent?200:-50),net=i=>sum(s.records.map(r=>r.changes[i]+(r.parent===i?200:-50)))+(s.feeDone?feeChanges()[i]:0);function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}function mutate(fn){fn();save();render()}function setPage(p){mutate(()=>{s.page=p;s.error='';s.confirm='';s.cashWho=null})}const btn=(label,action,cls='',disabled=false)=>`<button type="button" class="${cls}" data-act="${action}" ${disabled?'disabled':''}>${label}</button>`,line=(a,b)=>`<div class="line"><span>${a}</span><b>${b}</b></div>`,panel=(title,content)=>`<section class="panel"><h2>${title}</h2>${content}</section>`,confirm=(title,body,action)=>`<div class="confirm"><h3>${title}</h3><div class="hint">${body}</div><div class="actions">${btn('キャンセル','cancel','secondary')}${btn('確定する',action)}</div></div>`;const footer=()=>`<section class="panel"><div class="row"><b class="gold">チップ・累計管理</b>${s.page!=='add'?btn('＋ 追加購入','openAdd:0','',false):''}</div><div class="stat" style="margin-top:12px"><div class="box"><div class="tiny">預かり現金</div><div class="big">${y(sum(s.purchases))}</div></div><div class="box"><div class="tiny">チップ総額</div><div class="big">${y(sum(s.wallet))}</div></div></div>${N.map((n,i)=>line(n,`<span class="gold">${y(s.wallet[i])}</span>`)).join('')}<hr/><div class="row"><b class="gold">累計収支（参加費込み）</b><span class="pill">${s.records.length}R 精算済</span></div>${N.map((n,i)=>line(n,sy(net(i)))).join('')}<p class="footnote">現在のレースの参加費も収支に含めています。レースの払戻しは確定後に反映されます。</p>${(s.page==='fee'||s.page==='setup')&&s.records.length?btn('ゲーム終了・最終換金','final','secondary full'):''}${btn('記録のバックアップ・復元','backup','secondary full')}${btn('全データをリセット','resetAsk','secondary full')}${s.confirm==='reset'?confirm('全データを消去しますか？','購入・レース・換金記録はすべて消去されます。','reset'):''}</section>`;function render(){const a=s.sel.filter(i=>i<4).length,b=s.sel.filter(i=>i>=4).length;let content='';if(s.page==='initial'){content=panel('1. 初回チップ一括登録',`<p class="hint">5人の購入額を設定します。各1,000円から変更できます。</p>${N.map((n,i)=>`<div class="box"><div class="row"><b>${n}</b><b class="gold big">${y(s.initial[i])}</b></div><div class="quad" style="margin-top:10px">${[[-1000,'−1000'],[-500,'−500'],[500,'＋500'],[1000,'＋1000']].map(([d,t])=>btn(t,`initial:${i}:${d}`,d<0?'secondary':'')).join('')}</div></div>`).join('')}${line('購入合計',`<span class="gold big">${y(sum(s.initial))}</span>`)}${s.confirm==='initial'?confirm('現金を受け取りましたか？','全員の現金とチップを確認してから確定してください。','initialDone'):btn('5人分を一括登録','initialAsk','full')}`)}else if(s.page==='fee'){const bad=children().find(p=>s.wallet[p.i]<50);content=panel('2. 参加費の徴収',`<p class="hint">親の<b>${N[s.parent]}</b>が子4人から各1ベット（50円）ずつ受け取ります。</p><div class="box">${children().map(p=>line(p.name,`<span class="${s.wallet[p.i]<50?'red':''}">50円 / 保有 ${y(s.wallet[p.i])}</span>`)).join('')}<hr/>${line('親の受取合計','<span class="gold big">200円</span>')}${line('徴収後の親の保有額',y(s.wallet[s.parent]+200))}</div>${bad?`<div class="warn">${bad.name}さんのチップが不足しています。</div>${btn('不足している子のチップを追加購入',`openAdd:${bad.i}`,'full')}`:s.confirm==='fee'?confirm('参加費200円を受け取りましたか？','確定すると子4人から50円ずつ引き、親へ200円移します。','feeDone'):btn('参加費を受け取って登録','feeAsk','full')}${btn('チップ残高を確認','balances','secondary full')}`)}else if(s.page==='setup'){content=panel('3. 出走馬を選択',`<p class="hint">①〜④から2頭、⑤〜⑩から4頭。合計6頭ちょうど選択してください。</p><div class="stat"><div class="box">①〜④ <b class="${a===2?'green':'gold'}">${a}/2頭</b></div><div class="box">⑤〜⑩ <b class="${b===4?'green':'gold'}">${b}/4頭</b></div></div><div class="two" style="margin-top:12px">${H.map((h,i)=>`<button type="button" class="horse ${s.sel.includes(i)?'on':''}" data-act="horse:${i}"><strong>${i+1}番 ${s.sel.includes(i)?'✓':''}</strong><span class="hn">${h[0]}</span><span class="gold">${h[1]}倍</span></button>`).join('')}</div>${s.sel.length<6?`<div class="warn">出走馬が${s.sel.length}頭です。6頭そろえてください。</div>`:''}${btn('出走馬を確定・馬券登録へ','setupDone','full',!(a===2&&b===4))}${btn('参加費の確認に戻る','feeReview','secondary full')}`)}else if(s.page==='feeReview'){content=panel('参加費・徴収済み',`<div class="box green">✓ 第${s.round}レース：200円徴収済み</div><p class="hint">二重徴収を防ぐため、ここでは再徴収できません。</p>${btn('出走馬の選択に戻る','setup','full')}`)}else if(s.page==='bet'){content=panel('4. 子4人の馬券を登録',`<p class="hint">1人につき最大3ベット（150円）。6頭の中から賭ける馬を選びます。</p><div class="quad">${children().map(p=>btn(`${p.name}<br>${count(p.i)}/3`,`buyer:${p.i}`,`tab ${s.buyer===p.i?'on':''}`)).join('')}</div><div class="row" style="margin-top:16px"><b>${N[s.buyer]}の馬券</b><b class="gold">${count(s.buyer)}/3ベット</b></div>${s.sel.map(h=>`<div class="betrow"><div class="desc"><b>${h+1}番 ${H[h][0]}</b><div class="gold">${H[h][1]}倍</div></div>${btn('−',`bet:${h}:-1`,'secondary',!(s.bets[s.buyer+'-'+h]||0))}<span class="num">${s.bets[s.buyer+'-'+h]||0}</span>${btn('＋',`bet:${h}:1`,'',count(s.buyer)>=3)}</div>`).join('')}<div class="box">${line('全員の賭け金',`<span class="gold big">${y(pot())}</span>`)}${children().map(p=>line(`${p.name}（${count(p.i)}枚）`,`<span class="${stake(p.i)>s.wallet[p.i]?'red':''}">${y(stake(p.i))} / 保有 ${y(s.wallet[p.i])}</span>`)).join('')}</div><div class="actions">${btn('出走馬に戻る','backSetupAsk','secondary')}${btn('馬券登録を完了','betDone','',!pot()||children().some(p=>stake(p.i)>s.wallet[p.i]))}</div>${s.confirm==='backSetup'?confirm('出走馬を選び直しますか？','入力済みの馬券はすべて消去します。参加費は取り消しません。','backSetup'):''}`)}else if(s.page==='race'){const payouts=children().filter(p=>payout(p.i)>0);content=panel('5. レース結果・払戻し',`<p class="hint">1着になった馬を選んでください。</p><div class="two">${s.sel.map(h=>`<button class="horse ${s.winner===h?'on':''}" data-act="winner:${h}"><strong>${h+1}番 ${s.winner===h?'✓':''}</strong><span class="hn">${H[h][0]}</span><span class="gold">${H[h][1]}倍</span></button>`).join('')}</div>${s.winner!==null?`<div class="box">${line('親が受け取る賭け金',y(pot()))}${line('払戻し合計',y(paid()))}${line('参加費（徴収済み）','200円')}<hr/>${line('親の馬券収支',`<span class="${pot()-paid()>=0?'green':'red'}">${sy(pot()-paid())}</span>`)}${line('精算後の親の保有額',`<span class="${parentAfter()>=0?'green':'red'}">${sy(parentAfter())}</span>`)}</div><h3 class="gold">誰から誰へ払戻すか</h3>${payouts.length?payouts.map(p=>`<div class="transfer"><b>${N[s.parent]}（親）から${p.name}へ</b><div class="amt">${y(payout(p.i))}</div><div class="tiny">${s.bets[p.i+'-'+s.winner]}ベット × 50円 × ${H[s.winner][1]}倍</div></div>`).join(''):'<div class="box">的中者なし・払戻しなし</div>'}${parentAfter()<0?`<div class="warn">親のチップが${y(-parentAfter())}不足しています。追加購入してから精算してください。</div>${btn('親のチップを追加購入',`openAdd:${s.parent}`,'full')}`:''}`:''}<div class="actions">${btn('馬券を修正','bet','secondary')}${btn('精算内容を確認','settleAsk','',s.winner===null||parentAfter()<0)}</div>${s.confirm==='settle'?confirm('この結果で精算しますか？',`1着：${s.winner+1}番 ${H[s.winner][0]}。親からの払戻し合計は${y(paid())}です。`,'settle'):''}`)}else if(s.page==='result'){const r=s.records[s.records.length-1],pays=N.map((name,i)=>({name,i,value:i===r.parent?0:(r.bets[i+'-'+r.winner]||0)*50*H[r.winner][1]})).filter(p=>p.value>0);content=panel(`第${s.round}レース 精算完了`,`<p>🏆 1着：${r.winner+1}番 ${H[r.winner][0]}</p><h3>払戻し明細</h3>${pays.length?pays.map(p=>`<div class="transfer"><b>${N[r.parent]}（親）から${p.name}へ</b><div class="amt">${y(p.value)}</div></div>`).join(''):'<div class="box">的中者なし・払戻しなし</div>'}<div class="box"><table><tr><th>参加者</th><th>今回収支<br>参加費込み</th><th>保有額</th></tr>${N.map((n,i)=>`<tr><td>${n}${i===r.parent?'（親）':''}</td><td class="${r.changes[i]+(i===r.parent?200:-50)>=0?'green':'red'}">${sy(r.changes[i]+(i===r.parent?200:-50))}</td><td>${y(s.wallet[i])}</td></tr>`).join('')}</table></div>${btn(`次の第${s.round+1}レースへ`,'next','full')}${btn('ゲーム終了・最終換金','final','secondary full')}`)}else if(s.page==='add'){content=panel('チップ追加購入',`<label class="small" for="who">購入者</label><select id="who" data-change="addWho">${N.map((n,i)=>`<option value="${i}" ${i===s.addWho?'selected':''}>${n}</option>`).join('')}</select><div class="box">${line('現在の保有額',y(s.wallet[s.addWho]))}<div style="text-align:center;margin:17px 0"><div class="small">追加購入額</div><div class="big gold">${y(s.addValue)}</div></div><div class="quad">${[[-1000,'−1000'],[-500,'−500'],[500,'＋500'],[1000,'＋1000']].map(([d,t])=>btn(t,`addValue:${d}`,d<0?'secondary':'')).join('')}</div>${line('購入後の保有額',y(s.wallet[s.addWho]+s.addValue))}</div>${s.confirm==='add'?confirm('本当にチップを追加しますか？',`${N[s.addWho]}さんが${y(s.addValue)}を追加購入します。現金を受け取ってから確定してください。`,'addDone'):btn('追加注文','addAsk','full')}${btn('元の画面に戻る','goBack','secondary full')}`)}else if(s.page==='balances'){content=panel('チップ残高の確認',`${N.map((n,i)=>line(n,y(s.wallet[i]))).join('')}${btn('レースに戻る','balanceBack','full')}`)}else if(s.page==='final'){const bank=sum(s.purchases)-s.wallet.reduce((a,v,i)=>a+(s.cashed[i]?v:0),0),remaining=s.wallet.reduce((a,v,i)=>a+(s.cashed[i]?0:v),0);content=panel('最終換金・ゲーム終了',`<p class="hint">実物のチップ枚数を確認し、現金を渡した人から「換金する」を押してください。</p>${N.map((n,i)=>`<div class="box"><div class="row"><b>${n}</b><b class="big gold">${y(s.wallet[i])}</b></div>${line('購入累計',y(s.purchases[i]))}${line('最終収支',`<span class="${s.wallet[i]-s.purchases[i]>=0?'green':'red'}">${sy(s.wallet[i]-s.purchases[i])}</span>`)}${btn(s.cashed[i]?'✓ 換金完了':'この人を換金する',`cashAsk:${i}`,'secondary full',s.cashed[i])}</div>`).join('')}${s.cashWho!==null?confirm(`${N[s.cashWho]}さんの換金を確定しますか？`,`現金${y(s.wallet[s.cashWho])}を渡し、チップを回収したことを確認してください。`,'cashDone'):''}<div class="box">${line('銀行の預かり現金総額',y(sum(s.purchases)))}${line('全員の換金予定額',y(sum(s.wallet)))}<hr/>${line('未払いの換金予定額',`<span class="gold">${y(remaining)}</span>`)}${line('銀行の現金残額',`<span class="gold">${y(bank)}</span>`)}<p class="${sum(s.purchases)===sum(s.wallet)?'green':'red'}">${sum(s.purchases)===sum(s.wallet)?'✓ 帳簿上の現金とチップは一致しています':'⚠ 現金とチップが一致していません'}</p>${s.cashed.every(Boolean)?'<p class="green">✓ 5人全員の換金が完了しました。</p>':''}</div>${btn('ゲームに戻る','finalBack','secondary full',s.cashed.some(Boolean))}${btn('記録をバックアップ','backup','secondary full')}`)}else if(s.page==='backup'){content=panel('バックアップ・復元',`<p class="hint">端末のデータが消える場合に備えて、記録をJSONファイルに保存できます。復元すると現在の記録は上書きされます。</p>${btn('記録をファイルに保存','export','full')}<label class="filebutton">バックアップファイルを読み込む<input id="restore" type="file" accept="application/json,.json"></label>${s.confirm==='restore'?confirm('バックアップを復元しますか？','現在のデータをバックアップの内容で上書きします。','restoreDone'):''}${btn('元の画面へ戻る','goBack','secondary full')}`)}const top=s.page==='initial'?'':`<div class="top"><span class="pill">第${s.round}レース</span><span class="gold"><b>親：${N[s.parent]}</b></span></div>`;$.innerHTML=top+(s.error?`<div class="error">${esc(s.error)}</div>`:'')+content+(!['initial','final','backup'].includes(s.page)?footer():'');}let backupObject=null;function action(act){const [cmd,p,q]=act.split(':');mutate(()=>{s.error='';switch(cmd){case 'cancel':s.confirm='';s.cashWho=null;break;case 'initial':s.initial[+p]=Math.max(0,s.initial[+p]+(+q));s.confirm='';break;case 'initialAsk':s.confirm='initial';break;case 'initialDone':s.wallet=[...s.initial];s.purchases=[...s.initial];s.page='fee';s.confirm='';break;case 'feeAsk':s.confirm='fee';break;case 'feeDone':if(children().some(p=>s.wallet[p.i]<50)){s.error='参加費用のチップが不足しています。';break}s.wallet=s.wallet.map((v,i)=>v+(i===s.parent?200:-50));s.feeDone=true;s.page='setup';s.confirm='';break;case 'horse':{const h=+p;if(s.sel.includes(h))s.sel=s.sel.filter(x=>x!==h);else if(s.sel.filter(x=>x<4).length>=2&&h<4)s.error='①〜④は2頭までです。';else if(s.sel.filter(x=>x>=4).length>=4&&h>=4)s.error='⑤〜⑩は4頭までです。';else s.sel=[...s.sel,h].sort((a,b)=>a-b);break}case 'setupDone':if(s.sel.length!==6||s.sel.filter(x=>x<4).length!==2||s.sel.filter(x=>x>=4).length!==4){s.error='出走馬は①〜④から2頭、⑤〜⑩から4頭を選択してください。';break}s.bets={};s.buyer=children()[0].i;s.page='bet';break;case 'buyer':s.buyer=+p;break;case 'bet':{const h=+p,d=+q;if(d>0&&count(s.buyer)>=3){s.error='1人3ベットまでです。';break}const key=s.buyer+'-'+h;s.bets[key]=Math.max(0,(s.bets[key]||0)+d);break}case 'backSetupAsk':s.confirm='backSetup';break;case 'backSetup':s.bets={};s.confirm='';s.page='setup';break;case 'betDone':{const bad=children().find(p=>stake(p.i)>s.wallet[p.i]);if(bad){s.error=bad.name+'さんのチップが不足しています。';break}if(!pot()){s.error='賭け金を入力してください。';break}s.page='race';break}case 'winner':s.winner=+p;s.confirm='';break;case 'settleAsk':s.confirm='settle';break;case 'settle':{if(s.winner===null||parentAfter()<0){s.error='精算できません。親の残高をご確認ください。';break}const changes=N.map((_,i)=>i===s.parent?pot()-paid():payout(i)-stake(i));const r={round:s.round,parent:s.parent,winner:s.winner,changes,pot:pot(),paid:paid(),bets:{...s.bets}};s.wallet=s.wallet.map((v,i)=>v+changes[i]);s.records.push(r);s.feeDone=false;s.page='result';s.confirm='';break}case 'next':{s.round++;s.parent=(s.parent+1)%5;s.feeDone=false;s.sel=[0,1,4,5,6,7];s.bets={};s.buyer=N.findIndex((_,i)=>i!==s.parent);s.winner=null;s.page='fee';break}case 'openAdd':s.addWho=+p;s.addValue=500;s.back=s.page;s.page='add';s.confirm='';break;case 'addValue':s.addValue=Math.max(500,s.addValue+(+p));s.confirm='';break;case 'addAsk':s.confirm='add';break;case 'addDone':s.wallet[s.addWho]+=s.addValue;s.purchases[s.addWho]+=s.addValue;s.page=s.back;s.confirm='';break;case 'goBack':s.page=s.back;s.confirm='';break;case 'balances':s.page='balances';break;case 'balanceBack':s.page=s.feeDone?'setup':'fee';break;case 'feeReview':s.page='feeReview';break;case 'setup':s.page='setup';break;case 'race':s.page='race';break;case 'final':if(s.page==='fee'&&s.feeDone){s.error='参加費の処理を確認してください。';break}s.back=s.page;s.page='final';break;case 'cashAsk':s.cashWho=+p;break;case 'cashDone':if(s.cashWho!==null){s.cashed[s.cashWho]=true;s.cashWho=null}s.confirm='';break;case 'finalBack':if(!s.cashed.some(Boolean))s.page=s.back;break;case 'backup':s.back=s.page;s.page='backup';break;case 'resetAsk':s.confirm='reset';break;case 'reset':s=defaults();break;case 'export':{const data=JSON.stringify({version:1,created:new Date().toISOString(),state:{...s,page:s.back}},null,2);const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='matsuda-derby-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);break}case 'restoreDone':if(backupObject){s={...defaults(),...backupObject,confirm:'',error:'',cashWho:null};backupObject=null}break;}})}$.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t&&!t.disabled)action(t.dataset.act)});$.addEventListener('change',async e=>{if(e.target.id==='who')mutate(()=>{s.addWho=Number(e.target.value);s.confirm='' });if(e.target.id==='restore'){const f=e.target.files?.[0];if(!f)return;try{const obj=JSON.parse(await f.text());const v=obj.state;if(obj.version!==1||!v||!Array.isArray(v.wallet)||v.wallet.length!==5||!Array.isArray(v.purchases)||v.purchases.length!==5||!Array.isArray(v.records)||!Array.isArray(v.cashed)||v.cashed.length!==5||!['initial','fee','setup','feeReview','bet','race','result','final'].includes(v.page))throw Error('形式が異なります');backupObject=v;mutate(()=>{s.confirm='restore'})}catch(err){mutate(()=>{s.error='バックアップファイルを読み込めませんでした。'})}}});render();})();
